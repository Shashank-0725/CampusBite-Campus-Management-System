<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Stats - CampusBite</title>
  <script src="/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/css/main.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .card {
      padding-left: 5%;
      padding-top: 2%;
    }
  </style>
</head>

<body>
  <!-- SHARED NAVBAR -->
  <div id="navbar-placeholder"></div>

  <div class="container">
    <h2 class="section-title">OVERVIEW</h2>

    <div class="grid">
      <div class="card">
        <h3>Today Revenue</h3>
        <p id="todayRevenue">₹0</p>
      </div>
      <div class="card">
        <h3>Today Orders</h3>
        <p id="todayOrders">0</p>
      </div>
      <div class="card">
        <h3>Monthly Revenue</h3>
        <p id="monthlyRevenue">₹0</p>
      </div>
      <div class="card">
        <h3>Total Items</h3>
        <p id="totalItems">0</p>
      </div>
    </div>

    <h2 class="section-title" style="margin-top:40px;">Most Ordered Items</h2>
    <canvas id="topItemsChart"></canvas>

    <h2 class="section-title" style="margin-top:40px;">Last 7 Days Revenue</h2>
    <canvas id="weeklyRevenueChart"></canvas>
  </div>

  <!-- SHARED FOOTER -->
  <div id="footer-placeholder"></div>

  <script src="/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', initStatsPage);
  </script>
</body>

</html>
