<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Orders - CampusBite</title>
  <script src="/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/css/main.css">
</head>

<body>
  <!-- SHARED NAVBAR -->
  <div id="navbar-placeholder"></div>

  <div class="container">
    <h2 class="section-title">PENDING / PREPARING</h2>
    <div id="staff-orders-pending-empty" class="text-center" style="display:none;">
      NO PENDING OR PREPARING ORDERS.
    </div>
    <div id="staff-orders-pending" class="grid"></div>

    <h2 class="section-title" style="margin-top:40px;">READY</h2>
    <div id="staff-orders-ready-empty" class="text-center" style="display:none;">
      NO READY ORDERS.
    </div>
    <div id="staff-orders-ready" class="grid"></div>

    <h2 class="section-title" style="margin-top:40px;">COMPLETED</h2>
    <div id="staff-orders-completed-empty" class="text-center" style="display:none;">
      NO COMPLETED ORDERS.
    </div>
    <div id="staff-orders-completed" class="grid"></div>

    <h2 class="section-title" style="margin-top:40px;">CANCELLED</h2>
    <div id="staff-orders-cancelled-empty" class="text-center" style="display:none;">
      NO CANCELLED ORDERS.
    </div>
    <div id="staff-orders-cancelled" class="grid"></div>
  </div>

  <!-- SHARED FOOTER -->
  <div id="footer-placeholder"></div>

  <script src="/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initStaffOrdersPage();
    });
  </script>
</body>

</html>
