<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Login - CampusBite</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.75)),
        url("/assets/canteen inside.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      position: relative;
    }

    .auth-wrapper::before {
      content: "";
      position: absolute;
      inset: 0;
      backdrop-filter: blur(1px);
      -webkit-backdrop-filter: blur(2px);
    }

    .auth-card {
      position: relative;
      z-index: 2;
    }
  </style>
</head>

<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <h2>Staff Login</h2>
      <form id="staffLoginForm" onsubmit="return handleStaffLogin(event)">
        <div class="form-group">
          <label for="staffId">Staff ID / Email</label>
          <input type="text" id="staffId" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-container">
            <input type="password" id="password" required>
            <button type="button" class="toggle-password" onclick="togglePassword('password', this)">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <p class="error-msg" id="errorMsg" style="display:none;">
          Invalid staff credentials!
        </p>

        <button type="submit" class="btn-submit">Login</button>
      </form>
      <div class="auth-link">
        Student? <a href="/student/login.html" style="text-decoration: underline; color: aqua;">Student Login</a>
      </div>
    </div>
  </div>

  <script src="/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const err = document.getElementById('errorMsg');
      if (err) err.style.display = 'none';
    });
  </script>
</body>

</html>
