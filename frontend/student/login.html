<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login - CampusBite</title>
  <link rel="stylesheet" href="/css/main.css">

  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.75)),
        url("/assets/canteen inside.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      position: relative;
    }

    .auth-wrapper::before {
      content: "";
      position: absolute;
      inset: 0;
      backdrop-filter: blur(1px);
      -webkit-backdrop-filter: blur(2px);
    }

    .auth-card {
      position: relative;
      z-index: 2;
    }
  </style>
</head>

<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <h2>Student Login</h2>
      <form id="loginForm" onsubmit="return handleLogin(event)">
        <div class="form-group">
          <label for="email">Email / USN</label>
          <input type="text" id="email" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required>
        </div>
        <p class="error-msg" id="errorMsg" style="display:none;">
          Invalid credentials!
        </p>

        <button type="submit" class="btn-submit">Login</button>
      </form>
      <div class="auth-link">
        Don't have an account? <a href="/student/register.html" style="text-decoration: underline; color: aqua;">
          Register</a>
      </div>
      <div class="auth-link" style="margin-top: 10px;">
        Canteen Staff? <a href="/staff/login.html" style="text-decoration: underline; color: #f39c12;">Staff Login</a>
      </div>
    </div>
  </div>

  <script src="/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const err = document.getElementById('errorMsg');
      if (err) err.style.display = 'none';
    });
  </script>
</body>

</html>
