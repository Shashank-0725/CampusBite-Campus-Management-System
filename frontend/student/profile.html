<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Profile - CampusBite</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
</head>

<body>
  <!-- SHARED NAVBAR -->
  <div id="navbar-placeholder"></div>

  <div class="auth-wrapper">
    <div class="auth-card">
      <h2>My Profile</h2>

      <!-- PERSONAL DETAILS -->
      <form onsubmit="return updateProfile(event)">
        <div class="form-group">
          <label>Full Name</label>
          <input id="profileName" required>
        </div>

        <div class="form-group">
          <label>Email</label>
          <input id="profileEmail" required>
        </div>

        <div class="form-group">
          <label>Mobile</label>
          <input id="profileMobile">
        </div>

        <div class="form-group">
          <label>USN / Staff ID</label>
          <input id="profileId" disabled>
        </div>

        <div class="form-group">
          <label>Role</label>
          <input id="profileRole" disabled>
        </div>

        <button class="btn-submit">SAVE CHANGES</button>
      </form>

      <hr style="margin:30px 0;">

      <!-- CHANGE PASSWORD -->
      <h3>Change Password</h3>
      <form onsubmit="return changePassword(event)">
        <div class="form-group">
          <label>Current Password</label>
          <input type="password" id="oldPassword" required>
        </div>

        <div class="form-group">
          <label>New Password</label>
          <input type="password" id="newPassword" required>
        </div>

        <button class="btn-submit">UPDATE PASSWORD</button>
      </form>
    </div>
  </div>

  <!-- SHARED FOOTER -->
  <div id="footer-placeholder"></div>

  <script src="/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', initProfilePage);
  </script>
</body>

</html>
